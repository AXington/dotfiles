[project]
name = "tuneshift"
version = "0.1.0"
description = "Canonical playlist manager with cross-platform distribution"
requires-python = ">=3.10"
dependencies = [
    "tidalapi==0.8.11",
    "spotipy>=2.25.1",
    "ytmusicapi>=1.8.2",
    "anthropic==0.40.0",
    "musicbrainzngs==0.7.1",
    "python3-discogs-client>=2.7,<3.0",
    "rapidfuzz>=3.0,<4.0",
    "pyyaml==6.0.2",
    "shtab==1.7.1",
]

[project.scripts]
tuneshift = "tuneshift.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pip-audit",
    "ruff>=0.15",
    "mypy>=1.10",
    "bandit>=1.7",
    "radon>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
tuneshift = ["matching/*.yaml"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Permanent select set. S113 (request timeout) and S310 (urlopen scheme) are
# enforced: every raw HTTP/urlopen site sets an explicit timeout and is guarded by
# a validator (OLLAMA_HOST SSRF check / _ensure_https_url) or carries a justified
# noqa. BLE001 (blind-except) is enforced: every remaining broad `except Exception`
# is a genuine boundary handler (per-platform/per-item degrade loop, best-effort
# probe, or thread-marshal) that logs+surfaces or returns an explicit sentinel and
# carries a justified noqa; all others were narrowed to specific types.
# S608 stays on: every hardcoded-SQL site is allowlist-guarded and carries a
# justified noqa.
select = ["E", "F", "I", "B", "ARG", "RUF", "UP", "BLE", "S113", "S310", "S608"]

[tool.ruff.lint.per-file-ignores]
# Tests may use unused fixtures/args and long descriptive assertions.
"tests/**" = ["ARG", "E501", "B", "RUF"]
# E501 waived file-wide on these modules. Each embeds long string literals
# that cannot be reflowed and cannot carry an inline noqa (the over-length text is
# inside the string): the persistence package holds the head CREATE TABLE / index
# DDL, the versioned migration DDL, and long single-line SQL query literals whose
# text SQLite stores verbatim in sqlite_master or binds as parameterized queries;
# the other three hold LLM prompt bodies whose line structure is semantically
# significant. These files also contain some over-length single-line SQL literals;
# a file-scoped waiver is unavoidable because an inline noqa on those would be
# flagged RUF100 once the string-interior lines force the file-scoped ignore. Every
# OTHER module remains E501-gated (enforced by
# tests/test_lint_regressions.py::test_no_e501).
"tuneshift/db.py" = ["E501"]
"tuneshift/persistence/**/*.py" = ["E501"]
"tuneshift/sequencer/classifier.py" = ["E501"]
"tuneshift/enrichment/pipeline.py" = ["E501"]
"tuneshift/commands/batch_cmd.py" = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
# Strict enforcement (disallow_untyped_defs, etc.) is deferred to Phase 4.4 to
# avoid blocking CI on a large initial error count; the CI mypy step is
# continue-on-error until then.
