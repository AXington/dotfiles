[project]
name = "tuneshift"
version = "0.1.0"
description = "Canonical playlist manager with cross-platform distribution"
requires-python = ">=3.10"
dependencies = [
    "tidalapi==0.8.11",
    "spotipy>=2.25.1",
    "ytmusicapi>=1.8.2",
    "anthropic==0.40.0",
    "musicbrainzngs==0.7.1",
    "python3-discogs-client>=2.7,<3.0",
    "rapidfuzz>=3.0,<4.0",
    "pyyaml==6.0.2",
    "shtab==1.7.1",
]

[project.scripts]
tuneshift = "tuneshift.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pip-audit",
    "ruff>=0.15",
    "mypy>=1.10",
    "bandit>=1.7",
    "radon>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
tuneshift = ["matching/*.yaml"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Permanent select set. S113/S310/BLE are intentionally deferred and enabled in a
# later remediation phase once their sites are individually justified. S608 stays
# on: every hardcoded-SQL site is allowlist-guarded and carries a justified noqa.
select = ["E", "F", "I", "B", "ARG", "RUF", "UP", "S608"]

[tool.ruff.lint.per-file-ignores]
# Tests may use unused fixtures/args and long descriptive assertions.
"tests/**" = ["ARG", "E501", "B", "RUF"]

[tool.ruff.format]
line-ending = "lf"
